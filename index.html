<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102b44"><title>MARCOM-B | Theorie en oefenen</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17324b;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#102b44;color:white;padding:19px 18px 15px;position:sticky;top:0;z-index:3;box-shadow:0 2px 10px #102b4430}header strong{font-size:1.25rem}header small{display:block;color:#c7e4f3;margin-top:3px}.wrap{max-width:920px;margin:auto;padding:18px 15px 85px}.tabs{display:flex;gap:8px;margin-bottom:17px;overflow:auto}.tabs button,button{font:inherit;cursor:pointer}.tabs button{border:1px solid #bdd1dd;background:white;border-radius:11px;padding:11px 15px;white-space:nowrap;color:#17324b}.tabs .active{background:#086e87;color:white;border-color:#086e87}.intro{background:#e4f3f7;border-left:4px solid #0787a3;border-radius:9px;padding:13px 16px;margin-bottom:18px}.cards{display:grid;gap:11px}.card{background:white;border:1px solid #dbe6ec;border-radius:14px;padding:17px;text-align:left;color:#17324b;box-shadow:0 2px 7px #1c41500c;width:100%}.card b{display:block;font-size:1.04rem}.card small{display:block;margin-top:7px;color:#587084}.pill{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#087c91;margin-bottom:6px;display:block}.back{border:0;background:none;color:#08758c;font-weight:700;padding:9px 0 16px}.reader,.quizbox{background:white;border-radius:15px;padding:20px;box-shadow:0 3px 15px #1c415013}.reader h1{font-size:1.45rem;line-height:1.25;margin:0 0 18px}.reader h3{font-size:1.12rem;margin:25px 0 9px;color:#0c5973}.reader p{line-height:1.65;margin:10px 0}.reader .bullet{padding-left:12px;border-left:2px solid #d8e9ed}.tablewrap{overflow-x:auto;margin:15px 0}table{border-collapse:collapse;width:100%;min-width:420px;font-size:.92rem}td{padding:10px;border:1px solid #d9e5eb;vertical-align:top;line-height:1.45}tr:first-child{background:#eaf4f8;font-weight:650}.quizbox{margin-top:17px}.quizbox h2{font-size:1.15rem}.question{padding:14px 0;border-top:1px solid #e2eaf0}.question p{margin:0 0 8px;line-height:1.5}.answer{background:#eaf6ef;border-radius:8px;padding:11px;margin-top:8px;line-height:1.5}.action{border:0;background:#086e87;color:white;border-radius:9px;padding:9px 13px;font-weight:650}.muted{color:#597185;line-height:1.55}.foot{font-size:.86rem;color:#597185;margin:24px 0}input[type=search]{width:100%;padding:13px;border:1px solid #b7cbd6;border-radius:11px;font:inherit;margin-bottom:14px}button:focus-visible,input:focus-visible{outline:3px solid #ffbd59;outline-offset:2px}@media(min-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.reader,.quizbox{padding:28px}}
</style></head><body><header><strong>MARCOM-B</strong><small>Theorie • praktijkoproepen • oefenen</small></header><main class="wrap"><nav class="tabs" aria-label="Onderdelen"><button id="tab-theory" onclick="list('Theorie')">Theorie</button><button id="tab-practice" onclick="list('Praktijkoproepen')">Praktijkoproepen</button><button id="tab-quiz" onclick="general()">Algemene vragen</button></nav><div id="app"></div><p class="foot">Studie- en oefenmateriaal uit de twee aangeleverde documenten. Controleer voor werkelijk radioverkeer altijd de actuele officiële eisen, kanaalindeling, lokale aanwijzingen en de handleiding van je apparatuur. Geen marifoonsimulator.</p></main><script>
const chapters=[{"title": "1. Het radiosysteem begrijpen", "html": "<h3>1.1 De kern in één beeld<\/h3><p>Een marifoon is een VHF-zender en -ontvanger. VHF-signalen volgen in hoofdzaak de zichtlijn. Antennehoogte is daarom meestal belangrijker voor het bereik dan extra zendvermogen. Een hoge, vrij geplaatste antenne “ziet” verder over de radiohorizon.<\/p><p>Ezelsbrug: Hoogte helpt, vermogen ondersteunt. Gebruik niet automatisch hoog vermogen.<\/p><h3>1.2 Frequentie en golflengte<\/h3><p>Frequentie is het aantal trillingen per seconde en wordt uitgedrukt in hertz. Bij een hogere frequentie hoort een kortere golflengte. Voor de bediening hoef je meestal niet te rekenen, maar je moet het verband begrijpen.<\/p><div class=\"tablewrap\"><table><tr><td>Begrip<\/td><td>Betekenis<\/td><td>Praktische betekenis<\/td><\/tr><tr><td>Frequentie<\/td><td>Aantal trillingen per seconde<\/td><td>Bepaalt waar in het radiospectrum je uitzendt<\/td><\/tr><tr><td>Golflengte<\/td><td>Afstand van één volledige golf<\/td><td>Hangt omgekeerd samen met frequentie<\/td><\/tr><tr><td>VHF<\/td><td>Very High Frequency<\/td><td>Voor maritieme spraak, DSC en data in het VHF-bereik<\/td><\/tr><tr><td>UHF<\/td><td>Ultra High Frequency<\/td><td>Onder meer voor communicatie met beperkt lokaal bereik<\/td><\/tr><\/table><\/div><h3>1.3 Simplex, semi-duplex en duplex<\/h3><div class=\"tablewrap\"><table><tr><td>Vorm<\/td><td>Wat gebeurt er?<\/td><td>Herkenning<\/td><\/tr><tr><td>Simplex<\/td><td>Beide stations gebruiken dezelfde frequentie en spreken om de beurt.<\/td><td>Je hoort elkaar niet tijdens het zenden.<\/td><\/tr><tr><td>Semi-duplex<\/td><td>Schip en wal gebruiken verschillende frequenties; het scheepsstation werkt om de beurt.<\/td><td>Vaak bij verkeer via een walstation.<\/td><\/tr><tr><td>Duplex<\/td><td>Zenden en ontvangen kunnen gelijktijdig via twee frequenties.<\/td><td>Vergelijkbaar met telefoneren, mits de installatie dit ondersteunt.<\/td><\/tr><\/table><\/div><p>Praktijk: Druk de PTT-knop pas in nadat je hebt geluisterd. Wacht een fractie van een seconde vóór je begint te spreken, spreek rustig en laat daarna de knop los.<\/p><h3>1.4 Bereik en storingen<\/h3><p class=\"bullet\">• Antennehoogte en vrije zichtlijn vergroten het bruikbare bereik.<\/p><p class=\"bullet\">• Obstakels, lage antenneplaatsing en afscherming door de romp kunnen het bereik verminderen.<\/p><p class=\"bullet\">• Een slechte voeding, defecte connector of beschadigde coaxkabel kan de uitzending verzwakken.<\/p><p class=\"bullet\">• Squelch onderdrukt ruis, maar te hoog ingestelde squelch kan ook zwakke nuttige signalen wegdrukken.<\/p>", "questions": [], "group": "Theorie"}, {"title": "2. Bediening van de marifoon", "html": "<h3>2.1 Vaste controle vóór gebruik<\/h3><p class=\"bullet\">• Controleer voeding, antenneaansluiting en positiegegevens.<\/p><p class=\"bullet\">• Zet de marifoon aan en regel het volume.<\/p><p class=\"bullet\">• Stel de squelch zo in dat de ruis net verdwijnt.<\/p><p class=\"bullet\">• Controleer kanaal en zendvermogen.<\/p><p class=\"bullet\">• Luister voordat je uitzendt.<\/p><p class=\"bullet\">• Houd het bericht kort, duidelijk en zakelijk.<\/p><h3>2.2 Laag en hoog vermogen<\/h3><p>Gebruik laag vermogen als dat voor de verbinding voldoende is. Hoog vermogen is bedoeld voor situaties waarin meer bereik werkelijk noodzakelijk en toegestaan is. Beperk onnodige storing van andere gebruikers.<\/p><p>Let op: Op binnenwateren gelden specifieke kanaal-, ATIS- en vermogensregels. Een combi-installatie moet in de juiste modus staan voor het vaargebied.<\/p><h3>2.3 ATIS, MMSI en roepnaam<\/h3><div class=\"tablewrap\"><table><tr><td>Identificatie<\/td><td>Functie<\/td><td>Niet verwarren met<\/td><\/tr><tr><td>Roepnaam<\/td><td>Gesproken identificatie van het station<\/td><td>Scheepsnaam alleen<\/td><\/tr><tr><td>ATIS-code<\/td><td>Automatische identificatie bij uitzending in de binnenvaartmodus<\/td><td>MMSI<\/td><\/tr><tr><td>MMSI<\/td><td>Negen-cijferige identiteit voor DSC en GMDSS<\/td><td>Telefoonnummer of ATIS-code<\/td><\/tr><\/table><\/div><h3>2.4 Kanaaldiscipline<\/h3><p class=\"bullet\">• Kanaal 16 is internationaal het VHF-kanaal voor nood, spoed, veiligheid en oproepen volgens de geldende procedures.<\/p><p class=\"bullet\">• DSC-oproepen op VHF verlopen op kanaal 70. Kanaal 70 is niet voor spraak.<\/p><p class=\"bullet\">• Ga voor vervolgverkeer zo snel mogelijk naar een passend werkkanaal als de procedure dat vraagt.<\/p><p class=\"bullet\">• Gebruik een verkeerspost-, haven-, brug- of sluiskanaal voor het daarvoor bestemde verkeer.<\/p><p class=\"bullet\">• Maak geen onnodige uitzendingen en blokkeer een kanaal niet.<\/p><p>Examenvalkuil: DSC op kanaal 70 is de digitale alarmering. Het gesproken noodbericht volgt op het aangewezen spraakkanaal, doorgaans kanaal 16.<\/p>", "questions": [], "group": "Theorie"}, {"title": "3. Vier niveaus van radioverkeer", "html": "<div class=\"tablewrap\"><table><tr><td>Prioriteit<\/td><td>Signaalwoord<\/td><td>Wanneer?<\/td><td>Voorbeeld<\/td><\/tr><tr><td>1. Nood<\/td><td>MAYDAY<\/td><td>Ernstig en onmiddellijk gevaar voor schip of personen; onmiddellijke hulp nodig.<\/td><td>Brand, zinken, man overboord met acuut levensgevaar<\/td><\/tr><tr><td>2. Spoed<\/td><td>PAN PAN<\/td><td>Dringend bericht over veiligheid, maar geen distress.<\/td><td>Motoruitval bij verslechterende omstandigheden<\/td><\/tr><tr><td>3. Veiligheid<\/td><td>SÉCURITÉ<\/td><td>Belangrijk navigatie- of weerbericht.<\/td><td>Drijvend obstakel of lokaal gevaar<\/td><\/tr><tr><td>4. Routine<\/td><td>Geen prioriteitswoord<\/td><td>Normaal operationeel verkeer.<\/td><td>Oproep aan havenmeester<\/td><\/tr><\/table><\/div><p>Beslisvraag: Is er ernstig en onmiddellijk gevaar én is onmiddellijke hulp nodig? Dan is MAYDAY passend. Ontbreekt één van beide, beoordeel PAN PAN of routine.<\/p><h3>3.1 Wie heeft voorrang?<\/h3><p>Noodverkeer heeft absolute voorrang. Andere stations houden radiostilte als dat nodig is. Spoedverkeer heeft voorrang boven alle communicatie behalve noodverkeer. Veiligheidsverkeer komt daarna, gevolgd door routineverkeer.<\/p><h3>3.2 Bij twijfel<\/h3><p>In een echte noodsituatie staat veiligheid voorop. Geef de essentiële informatie: identiteit, positie, aard van het gevaar, benodigde hulp en aantal personen. Een perfect ingestudeerde tekst is minder belangrijk dan een juiste alarmering en begrijpelijke informatie.<\/p>", "questions": [], "group": "Theorie"}, {"title": "4. Spreekprocedures die je hardop moet oefenen", "html": "<h3>4.1 Gesproken MAYDAY<\/h3><p>Vaste volgorde: Prioriteit → identiteit → positie → aard nood → gewenste hulp → personen → aanvullende informatie.<\/p><div class=\"tablewrap\"><table><tr><td>Stap<\/td><td>Voorbeeldtekst<\/td><\/tr><tr><td>Alarmwoord<\/td><td>MAYDAY, MAYDAY, MAYDAY<\/td><\/tr><tr><td>Oproep<\/td><td>THIS IS [scheepsnaam] driemaal, [roepnaam], MMSI [nummer]<\/td><\/tr><tr><td>Noodbericht<\/td><td>MAYDAY [scheepsnaam en roepnaam]<\/td><\/tr><tr><td>Positie<\/td><td>MY POSITION IS [positie, duidelijk en ondubbelzinnig]<\/td><\/tr><tr><td>Probleem<\/td><td>[aard van het gevaar]<\/td><\/tr><tr><td>Hulp<\/td><td>I REQUIRE IMMEDIATE ASSISTANCE<\/td><\/tr><tr><td>Personen<\/td><td>[aantal] PERSONS ON BOARD<\/td><\/tr><tr><td>Aanvullend<\/td><td>[bijv. reddingsvlot, uiterlijke kenmerken, koers]<\/td><\/tr><tr><td>Afsluiting<\/td><td>OVER<\/td><\/tr><\/table><\/div><p>Spreek rustig. Herhaal cijfers en cruciale informatie als dat de verstaanbaarheid verbetert. Gebruik waar nodig het internationale spellingsalfabet.<\/p><h3>4.2 PAN PAN<\/h3><p>Gebruik PAN PAN voor een dringende veiligheidskwestie die nog geen onmiddellijke levensbedreigende nood is. Roep het gewenste station of “ALL STATIONS” op, identificeer jezelf en geef positie, situatie en gevraagde hulp.<\/p><h3>4.3 SÉCURITÉ<\/h3><p>Gebruik SÉCURITÉ voor belangrijke navigatie- of meteorologische veiligheidsinformatie. De eerste oproep kondigt het veiligheidsbericht aan; het inhoudelijke bericht kan daarna op een passend werkkanaal worden uitgezonden.<\/p><h3>4.4 Ontvangen van noodverkeer<\/h3><p class=\"bullet\">• Stop niet-noodzakelijk radioverkeer en luister.<\/p><p class=\"bullet\">• Noteer identiteit, positie, aard van de nood en gevraagde hulp.<\/p><p class=\"bullet\">• Bevestig alleen volgens de geldende procedure en wanneer dat passend is.<\/p><p class=\"bullet\">• Volg aanwijzingen van kuststation of reddingscoördinatiecentrum.<\/p><p class=\"bullet\">• Zet ontvangen noodinformatie nooit om in speculatie. Herhaal alleen wat je zeker hebt gehoord.<\/p><p>Belangrijk: Een ontvangstbevestiging van een DSC-distress alert is niet hetzelfde als een gesproken bevestiging van het noodbericht. Bedien alleen functies waarvan je de procedure kent.<\/p>", "questions": [], "group": "Theorie"}, {"title": "5. Taal, spelling en verstaanbaarheid", "html": "<h3>5.1 Internationaal spellingsalfabet<\/h3><div class=\"tablewrap\"><table><tr><td>Letter<\/td><td>Woord<\/td><td>Letter<\/td><td>Woord<\/td><\/tr><tr><td>A<\/td><td>Alfa<\/td><td>N<\/td><td>November<\/td><\/tr><tr><td>B<\/td><td>Bravo<\/td><td>O<\/td><td>Oscar<\/td><\/tr><tr><td>C<\/td><td>Charlie<\/td><td>P<\/td><td>Papa<\/td><\/tr><tr><td>D<\/td><td>Delta<\/td><td>Q<\/td><td>Quebec<\/td><\/tr><tr><td>E<\/td><td>Echo<\/td><td>R<\/td><td>Romeo<\/td><\/tr><tr><td>F<\/td><td>Foxtrot<\/td><td>S<\/td><td>Sierra<\/td><\/tr><tr><td>G<\/td><td>Golf<\/td><td>T<\/td><td>Tango<\/td><\/tr><tr><td>H<\/td><td>Hotel<\/td><td>U<\/td><td>Uniform<\/td><\/tr><tr><td>I<\/td><td>India<\/td><td>V<\/td><td>Victor<\/td><\/tr><tr><td>J<\/td><td>Juliett<\/td><td>W<\/td><td>Whiskey<\/td><\/tr><tr><td>K<\/td><td>Kilo<\/td><td>X<\/td><td>X-ray<\/td><\/tr><tr><td>L<\/td><td>Lima<\/td><td>Y<\/td><td>Yankee<\/td><\/tr><tr><td>M<\/td><td>Mike<\/td><td>Z<\/td><td>Zulu<\/td><\/tr><\/table><\/div><h3>5.2 Procedurewoorden<\/h3><div class=\"tablewrap\"><table><tr><td>Woord<\/td><td>Betekenis<\/td><\/tr><tr><td>THIS IS<\/td><td>Hier volgt de identiteit van het oproepende station.<\/td><\/tr><tr><td>OVER<\/td><td>Mijn uitzending is klaar; antwoord wordt verwacht.<\/td><\/tr><tr><td>OUT<\/td><td>Verbinding beëindigd; geen antwoord verwacht.<\/td><\/tr><tr><td>ROGER<\/td><td>Bericht ontvangen.<\/td><\/tr><tr><td>SAY AGAIN<\/td><td>Herhaal het genoemde deel of gehele bericht.<\/td><\/tr><tr><td>CORRECTION<\/td><td>Ik corrigeer een fout in mijn uitzending.<\/td><\/tr><tr><td>I SPELL<\/td><td>Ik spel het volgende woord fonetisch.<\/td><\/tr><\/table><\/div><p>Valkuil: Gebruik OVER en OUT niet samen. OVER vraagt om een antwoord; OUT beëindigt het verkeer.<\/p>", "questions": [], "group": "Theorie"}, {"title": "6. DSC zonder mystiek", "html": "<p>Digital Selective Calling is een digitale oproepfunctie. DSC maakt eerst contact of alarmeert; daarna volgt meestal radiotelefonie. De kern is dat doel, identiteit en categorie digitaal worden meegestuurd.<\/p><h3>6.1 Wat staat centraal?<\/h3><p class=\"bullet\">• MMSI: de digitale identiteit van het station.<\/p><p class=\"bullet\">• Kanaal 70: voor DSC-signalen op VHF, niet voor spraak.<\/p><p class=\"bullet\">• Categorie: distress, urgency, safety of routine.<\/p><p class=\"bullet\">• Type oproep: individueel, groep, geografisch gebied of alle stations, afhankelijk van apparatuur en procedure.<\/p><p class=\"bullet\">• Positie en tijd: cruciaal bij distress; controleer of deze correct worden aangeleverd.<\/p><h3>6.2 DSC-distress alert<\/h3><p class=\"bullet\">• Open of activeer de beschermde distress-bediening.<\/p><p class=\"bullet\">• Selecteer zo mogelijk de aard van de nood.<\/p><p class=\"bullet\">• Controleer positie en tijd wanneer de situatie dat toelaat.<\/p><p class=\"bullet\">• Houd de distressknop ingedrukt volgens de apparatuur-instructie.<\/p><p class=\"bullet\">• Schakel over naar het aangegeven spraakkanaal en zend het MAYDAY-noodbericht uit.<\/p><p>Principe: De digitale alert trekt aandacht en geeft kerngegevens. Het gesproken MAYDAY-bericht geeft de context die hulpverleners nodig hebben.<\/p><h3>6.3 Onbedoelde DSC-distress alert<\/h3><p>Annuleer een valse alarmering onmiddellijk volgens de procedure van de installatie en meld duidelijk dat het om een onbedoelde alarmering gaat. Schakel de installatie niet simpelweg uit en vaar niet door alsof er niets is gebeurd.<\/p><p>Veiligheid: Volg voor annulering de exacte handleiding van jouw apparatuur en de actuele cursusprocedure. Een verkeerde handeling kan de alarmering laten voortbestaan.<\/p>", "questions": [], "group": "Theorie"}, {"title": "7. GMDSS-apparatuur herkennen en gebruiken", "html": "<div class=\"tablewrap\"><table><tr><td>Apparaat<\/td><td>Doel<\/td><td>Wat moet je onthouden?<\/td><\/tr><tr><td>EPIRB 406 MHz<\/td><td>Alarmeren en helpen lokaliseren via satellietsysteem<\/td><td>Correct registreren, vrij kunnen komen of handmatig meenemen, buiten activeren volgens instructie.<\/td><\/tr><tr><td>Radar-SART<\/td><td>Zoek- en reddingseenheden naar overlevenden leiden via radarrespons<\/td><td>Zo hoog mogelijk plaatsen en activeren volgens instructie.<\/td><\/tr><tr><td>AIS-SART<\/td><td>Locatie van overlevenden zichtbaar maken via AIS-bericht<\/td><td>Zend een AIS-nooddoel uit; is iets anders dan radar-SART.<\/td><\/tr><tr><td>GMDSS-portofoon<\/td><td>Communicatie in overlevingssituaties<\/td><td>Accu, kanaalkeuze en waterdicht gebruik kennen.<\/td><\/tr><tr><td>NAVTEX<\/td><td>Ontvangst van maritieme veiligheidsinformatie<\/td><td>Station- en berichtsoorten selecteren; ontvangst controleren.<\/td><\/tr><tr><td>VHF-DSC-installatie<\/td><td>Digitale alarmering en gesproken communicatie<\/td><td>MMSI, positiebron, kanaal 70 en kanaal 16 begrijpen.<\/td><\/tr><\/table><\/div><h3>7.1 EPIRB<\/h3><p>Een EPIRB is voor distress-alarmering en lokalisatie. De registratie koppelt het baken aan schip en contactgegevens. Controleer de geldigheidsdatum van batterij en hydrostatische ontgrendeling, de bevestiging, registratie en periodieke testprocedure.<\/p><h3>7.2 SART<\/h3><p>Een radar-SART reageert op radarondervraging en helpt een reddingseenheid het baken te vinden. Een AIS-SART zendt AIS-berichten uit. Leer het verschil, omdat de verschijningsvorm op het ontvangende systeem anders is.<\/p><h3>7.3 NAVTEX<\/h3><p>NAVTEX levert maritieme veiligheidsinformatie. Je moet berichtcategorieën kunnen selecteren, weten welke categorieën niet zonder meer kunnen worden uitgeschakeld en kunnen controleren of het juiste zendstation is gekozen.<\/p>", "questions": [], "group": "Theorie"}, {"title": "8. Praktijkexamen: werk als een operator", "html": "<h3>8.1 De beoordelaar wil vooral zien<\/h3><p class=\"bullet\">• Dat je veilig en beheerst handelt.<\/p><p class=\"bullet\">• Dat je de juiste prioriteit en oproepvorm kiest.<\/p><p class=\"bullet\">• Dat je apparatuur systematisch bedient.<\/p><p class=\"bullet\">• Dat je cruciale informatie correct noteert en doorgeeft.<\/p><p class=\"bullet\">• Dat je fouten herkent en herstelt zonder paniek.<\/p><p class=\"bullet\">• Dat je de procedures hardop duidelijk kunt uitvoeren.<\/p><h3>8.2 Universele werkvolgorde<\/h3><div class=\"tablewrap\"><table><tr><td>Fase<\/td><td>Actie<\/td><td>Zelfcontrole<\/td><\/tr><tr><td>1. Situatie<\/td><td>Bepaal nood, spoed, veiligheid of routine.<\/td><td>Is er onmiddellijk gevaar?<\/td><\/tr><tr><td>2. Middel<\/td><td>Kies spraak, DSC of veiligheidsapparaat.<\/td><td>Past het middel bij het doel?<\/td><\/tr><tr><td>3. Instelling<\/td><td>Controleer kanaal, vermogen, positie en identiteit.<\/td><td>Staat de juiste modus actief?<\/td><\/tr><tr><td>4. Uitzending<\/td><td>Volg de vaste structuur.<\/td><td>Wie ben ik, waar ben ik, wat is er, wat heb ik nodig?<\/td><\/tr><tr><td>5. Ontvangst<\/td><td>Luister, noteer en bevestig correct.<\/td><td>Heb ik cijfers en positie precies?<\/td><\/tr><tr><td>6. Afronding<\/td><td>Volg instructies en beëindig correct.<\/td><td>Is vervolgactie duidelijk?<\/td><\/tr><\/table><\/div><h3>8.3 Veelgemaakte fouten<\/h3><p class=\"bullet\">• Te snel spreken en de PTT al loslaten vóór het laatste woord.<\/p><p class=\"bullet\">• Kanaal 70 als spraakkanaal behandelen.<\/p><p class=\"bullet\">• MMSI, ATIS en roepnaam door elkaar halen.<\/p><p class=\"bullet\">• Bij een noodoproep de positie of gewenste hulp vergeten.<\/p><p class=\"bullet\">• Direct antwoorden zonder eerst de ontvangen gegevens te noteren.<\/p><p class=\"bullet\">• Onnodig hoog vermogen gebruiken.<\/p><p class=\"bullet\">• Een noodapparaat testen buiten de voorgeschreven teststand of testprocedure.<\/p><p>Oefentip: Zeg elke procedure hardop terwijl je met je vinger de knopvolgorde op een afbeelding of simulator aanwijst. Kennis wordt pas praktijkvaardigheid als taal en handeling samenkomen.<\/p>", "questions": [], "group": "Theorie"}, {"title": "9. Scenario-oefeningen", "html": "<h3>Scenario 1: brand aan boord<\/h3><p>Je vaart op kustwater. Er is brand in de machinekamer, de bluspoging mislukt en rook trekt het verblijf in. Er zijn vier personen aan boord.<\/p><p class=\"bullet\">• Classificatie: MAYDAY.<\/p><p class=\"bullet\">• Handeling: zo mogelijk DSC-distress alert, daarna gesproken MAYDAY.<\/p><p class=\"bullet\">• Kerninformatie: identiteit, positie, brand, vier personen, onmiddellijke hulp, eventuele voorbereiding om schip te verlaten.<\/p><h3>Scenario 2: motorstoring zonder direct gevaar<\/h3><p>De motor valt uit, het weer is goed en je ligt vrij van vaargeul en kust. Er is geen onmiddellijk gevaar.<\/p><p class=\"bullet\">• Classificatie: routine of, als de omstandigheden snel onveilig worden, PAN PAN.<\/p><p class=\"bullet\">• Valkuil: niet elke motorstoring is automatisch een noodsituatie.<\/p><p class=\"bullet\">• Beslissing verandert wanneer drift, weer, verkeer of medische omstandigheden het gevaar vergroten.<\/p><h3>Scenario 3: drijvende container<\/h3><p>Je ziet een grote half ondergedompelde container in een drukke vaarroute.<\/p><p class=\"bullet\">• Classificatie: veiligheidsverkeer.<\/p><p class=\"bullet\">• Handeling: meld aan de bevoegde verkeersdienst of via passende veiligheidsprocedure.<\/p><p class=\"bullet\">• Kerninformatie: exacte positie, tijd, aard en zichtbaarheid van het object.<\/p><h3>Scenario 4: ontvangen MAYDAY<\/h3><p>Je hoort een zwak noodbericht. Je ontvangt scheepsnaam en positie, maar het aantal personen is onduidelijk.<\/p><p class=\"bullet\">• Noteer wat zeker is en markeer het ontbrekende gegeven.<\/p><p class=\"bullet\">• Luister of een kuststation of RCC reageert.<\/p><p class=\"bullet\">• Vul ontbrekende informatie niet zelf in.<\/p><p class=\"bullet\">• Wees gereed om volgens de procedure te relayeren of hulp te bieden.<\/p>", "questions": [], "group": "Theorie"}, {"title": "11. Eén-pagina geheugensteun", "html": "<div class=\"tablewrap\"><table><tr><td>Vraag<\/td><td>Denkvolgorde<\/td><\/tr><tr><td>Welke prioriteit?<\/td><td>Onmiddellijk ernstig gevaar = MAYDAY. Dringend = PAN PAN. Waarschuwing = SÉCURITÉ. Anders routine.<\/td><\/tr><tr><td>Welke identiteit?<\/td><td>Scheepsnaam, roepnaam en waar nodig MMSI.<\/td><\/tr><tr><td>Welke positie?<\/td><td>Gebruik een ondubbelzinnige positie en vermeld zo nodig referentiepunt.<\/td><\/tr><tr><td>Welke hulp?<\/td><td>Zeg concreet wat nodig is.<\/td><\/tr><tr><td>Welke kanalen?<\/td><td>DSC op 70. Spraak volgens procedure, bij distress doorgaans 16. Lokale werkkanalen voor vervolgverkeer.<\/td><\/tr><tr><td>Welke apparatuur?<\/td><td>EPIRB alarmeert via satellietsysteem; SART helpt lokaliseren; NAVTEX ontvangt veiligheidsinformatie.<\/td><\/tr><tr><td>Wat bij ontvangst?<\/td><td>Luisteren, noteren, prioriteit respecteren, correct bevestigen, instructies opvolgen.<\/td><\/tr><\/table><\/div><p>MAYDAY-kapstok: Wie ben je? Waar ben je? Wat is er? Wat heb je nodig? Hoeveel mensen? Wat is verder belangrijk?<\/p><h3>Persoonlijk studieplan<\/h3><div class=\"tablewrap\"><table><tr><td>Sessie<\/td><td>Onderwerp<\/td><td>Resultaat<\/td><\/tr><tr><td>1<\/td><td>Hoofdstuk 1 tot en met 3<\/td><td>Je kunt techniek en prioriteiten uitleggen.<\/td><\/tr><tr><td>2<\/td><td>Hoofdstuk 4 en 5<\/td><td>Je kunt MAYDAY, PAN PAN en spelling hardop uitvoeren.<\/td><\/tr><tr><td>3<\/td><td>Hoofdstuk 6 en 7<\/td><td>Je begrijpt DSC en herkent GMDSS-apparatuur.<\/td><\/tr><tr><td>4<\/td><td>Hoofdstuk 8 en 9<\/td><td>Je werkt scenario’s uit met vaste werkvolgorde.<\/td><\/tr><tr><td>5<\/td><td>Hoofdstuk 10 en geheugensteun<\/td><td>Je scoort minimaal 80% zonder boek.<\/td><\/tr><\/table><\/div>", "questions": [], "group": "Theorie"}, {"title": "12. Bronnen en actualiteitscontrole", "html": "<p>Deze studiewijzer is didactisch materiaal. Bij verschillen zijn de actuele officiële exameneisen, regelgeving, apparatuurhandleiding en aanwijzingen van de erkende opleider leidend.<\/p><p class=\"bullet\">• CBR, Exameneisen Basiscertificaat Marifonie per 1 oktober 2025 https://www.cbr.nl/nl/service/nl/breed/exameneisen-basiscertificaat-marifonie-per-1-oktober-2025<\/p><p class=\"bullet\">• CBR, Maritieme radiocommunicatie en examenonderdelen https://www.cbr.nl/nl/maritieme-radiocommunicatie-1<\/p><p class=\"bullet\">• CBR, Praktijkexamen Marcom-B (MB-P) https://www.cbr.nl/nl/beroepsexamens/maritieme-radiocommunicatie-1/mb-p<\/p><p class=\"bullet\">• RDI, Examen en bedieningscertificaten voor radioapparatuur op het water https://www.rdi.nl/onderwerpen/vergunningen-en-registraties/marifoons-en-overige-maritieme-communicatieapparatuur/examen-en-bedieningscertificaten<\/p><p class=\"bullet\">• CBR/EZ, Exameneisen Marcom-B, ingang 1 oktober 2025 https://www.ezs.nl/uploads/2/9/5/6/29563113/exameneisen_marcom-b__per_01-10-2025.pdf<\/p><p>Versie: 30 september 2026. De inhoud is bewust compact en in gewone taal opgesteld. Controleer vóór het examen altijd of het CBR nieuwere exameneisen heeft gepubliceerd.<\/p>", "questions": [], "group": "Theorie"}, {"title": "1. De vaste kapstok: de 4 W’s", "html": "<p>Een praktische oproep wordt begrijpelijk als je steeds dezelfde volgorde gebruikt. Denk aan: wie roep je, wie ben je, waar ben je en wat wil je?<\/p><div class=\"tablewrap\"><table><tr><td>Stap<\/td><td>Vraag<\/td><td>Voorbeeld<\/td><\/tr><tr><td>1<\/td><td>Wie roep je?<\/td><td>“Sluis Amerongen”<\/td><\/tr><tr><td>2<\/td><td>Wie ben je?<\/td><td>“Hier motorjacht Orion”<\/td><\/tr><tr><td>3<\/td><td>Waar ben je / vanwaar kom je?<\/td><td>“Ik nader vanuit de richting Wijk bij Duurstede”<\/td><\/tr><tr><td>4<\/td><td>Wat wil je?<\/td><td>“Ik wil graag mee met de eerstvolgende schutting”<\/td><\/tr><\/table><\/div><div class=\"tablewrap\"><table><tr><td>Basismodel [Naam object], hier [soort schip + scheepsnaam]. Ik nader vanuit [richting/positie] en wil graag [verzoek]. Over.<\/td><\/tr><\/table><\/div>", "questions": [{"q": "Welke vier W’s gebruik je voor een praktische oproep?", "a": "Wie roep je, wie ben je, waar ben je en wat wil je?"}], "group": "Praktijkoproepen"}, {"title": "2. Voor je de spreekknop indrukt", "html": "<p class=\"bullet\">• Zoek het aangewezen marifoonkanaal op het bord, de actuele waterkaart, de Wateralmanak of vaarweginformatie. Gebruik niet automatisch één vast kanaal voor alle bruggen en sluizen.<\/p><p class=\"bullet\">• Luister eerst of het kanaal vrij is.<\/p><p class=\"bullet\">• Bedenk je bericht vooraf en houd het kort.<\/p><p class=\"bullet\">• Druk de PTT in, wacht heel even en begin dan pas te spreken.<\/p><p class=\"bullet\">• Spreek rustig en zakelijk. Laat de PTT na “over” los.<\/p><div class=\"tablewrap\"><table><tr><td>Belangrijk De voorbeelden hieronder gebruiken geen vast kanaalnummer. Het juiste kanaal verschilt per object en vaargebied en staat doorgaans ter plaatse of in actuele nautische informatie.<\/td><\/tr><\/table><\/div>", "questions": [{"q": "Wat controleer je voordat je een brug of sluis oproept?", "a": "Het aangewezen kanaal, of het kanaal vrij is en wat je kort wilt zeggen."}], "group": "Praktijkoproepen"}, {"title": "3. Een sluis oproepen", "html": "<h3>Voorbeeld 1: informeren naar de eerstvolgende schutting<\/h3><div class=\"tablewrap\"><table><tr><td>Jij<\/td><td>“Sluis Amerongen, sluis Amerongen, hier motorjacht Orion. Over.”<\/td><\/tr><tr><td>Sluis<\/td><td>“Orion, hier Sluis Amerongen. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Goedemiddag. Ik ben een klein motorjacht en nader vanuit de richting Wijk bij Duurstede. Kan ik mee met de eerstvolgende schutting? Over.”<\/td><\/tr><tr><td>Sluis<\/td><td>“Orion, u kunt aansluiten achter de beroepsvaart en wachten voor het rode licht. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Aansluiten achter de beroepsvaart en wachten voor rood. Begrepen, dank u. Uit.”<\/td><\/tr><\/table><\/div><h3>Voorbeeld 2: positie en vaarrichting duidelijk maken<\/h3><div class=\"tablewrap\"><table><tr><td>Jij<\/td><td>“Sluis [naam], hier zeiljacht Neeltje. Over.”<\/td><\/tr><tr><td>Sluis<\/td><td>“Neeltje, hier Sluis [naam]. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Ik nader de benedenkant van de sluis, ben opvarend en wil graag schutten. Kunt u aangeven waar ik mag wachten? Over.”<\/td><\/tr><tr><td>Sluis<\/td><td>“Neeltje, wacht aan stuurboord bij de remming. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Wachten aan stuurboord bij de remming. Begrepen. Uit.”<\/td><\/tr><\/table><\/div><div class=\"tablewrap\"><table><tr><td>Examendenken Noem alleen gegevens die voor de verkeersafwikkeling nodig zijn. Herhaal een belangrijke instructie kort, zodat duidelijk is dat je die goed hebt ontvangen.<\/td><\/tr><\/table><\/div>", "questions": [{"q": "Wat doe je met een belangrijke instructie van het walstation?", "a": "Lees de kern van de instructie kort terug, zodat duidelijk is dat je die goed hebt ontvangen."}], "group": "Praktijkoproepen"}, {"title": "4. Een brug oproepen", "html": "<h3>Voorbeeld 1: vragen naar de opening<\/h3><div class=\"tablewrap\"><table><tr><td>Jij<\/td><td>“Zandslootbrug, hier zeiljacht Neeltje. Over.”<\/td><\/tr><tr><td>Brug<\/td><td>“Neeltje, hier Zandslootbrug. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Goedemiddag. Ik vaar richting Akkrum en kan niet onder de gesloten brug door. Wanneer is de volgende opening? Over.”<\/td><\/tr><tr><td>Brug<\/td><td>“Neeltje, de volgende opening is om zestien uur tien. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Zestien uur tien, begrepen. Dank u. Uit.”<\/td><\/tr><\/table><\/div><h3>Voorbeeld 2: onzeker of openen nodig is<\/h3><div class=\"tablewrap\"><table><tr><td>Jij<\/td><td>“Brug [naam], hier motorjacht Orion. Over.”<\/td><\/tr><tr><td>Brug<\/td><td>“Orion, hier Brug [naam]. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Ik nader vanuit het zuiden. Mijn doorvaarthoogte is vier meter twintig. Kan ik de gesloten brug veilig passeren? Over.”<\/td><\/tr><tr><td>Brug<\/td><td>“Orion, negatief. Wacht voor de brug; ik open na het tegemoetkomende verkeer. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Wachten voor de brug tot na het tegemoetkomende verkeer. Begrepen. Uit.”<\/td><\/tr><\/table><\/div><div class=\"tablewrap\"><table><tr><td>Veilig formuleren Vraag niet alleen “gaat u open?”, maar geef zo nodig richting, positie en relevante scheepsinformatie. Volg altijd de aanwijzingen en verkeerslichten ter plaatse.<\/td><\/tr><\/table><\/div>", "questions": [{"q": "Wat doe je met een belangrijke instructie van het walstation?", "a": "Lees de kern van de instructie kort terug, zodat duidelijk is dat je die goed hebt ontvangen."}], "group": "Praktijkoproepen"}, {"title": "5. Een jachthaven oproepen", "html": "<h3>Voorbeeld 1: vragen om een passantenplaats<\/h3><div class=\"tablewrap\"><table><tr><td>Jij<\/td><td>“Jachthaven [naam], hier zeiljacht Orion. Over.”<\/td><\/tr><tr><td>Haven<\/td><td>“Orion, hier Jachthaven [naam]. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Goedemiddag. Wij zijn een zeiljacht van tien meter vijftig, drie meter twintig breed en steken één meter zeventig. Heeft u voor vannacht een passantenplaats? Over.”<\/td><\/tr><tr><td>Haven<\/td><td>“Orion, ja. Vaar de haven binnen en meld u aan de meldsteiger aan stuurboord. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Naar de meldsteiger aan stuurboord. Begrepen, dank u. Uit.”<\/td><\/tr><\/table><\/div><h3>Voorbeeld 2: aanvullende informatie vragen<\/h3><div class=\"tablewrap\"><table><tr><td>Jij<\/td><td>“Jachthaven [naam], hier motorjacht Waterlelie. Over.”<\/td><\/tr><tr><td>Haven<\/td><td>“Waterlelie, hier Jachthaven [naam]. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Wij naderen de haveningang. Kunt u aangeven welke box voor ons bestemd is en of wij bakboord of stuurboord moeten aanleggen? Over.”<\/td><\/tr><tr><td>Haven<\/td><td>“Waterlelie, box B-twaalf, stuurboord aanleggen. Over.”<\/td><\/tr><tr><td>Jij<\/td><td>“Box B-twaalf, stuurboord aanleggen. Begrepen. Uit.”<\/td><\/tr><\/table><\/div>", "questions": [{"q": "Wat doe je met een belangrijke instructie van het walstation?", "a": "Lees de kern van de instructie kort terug, zodat duidelijk is dat je die goed hebt ontvangen."}], "group": "Praktijkoproepen"}, {"title": "6. Als je geen antwoord krijgt", "html": "<p class=\"bullet\">• Controleer of je op het juiste kanaal staat en of het volume en de squelch goed zijn ingesteld.<\/p><p class=\"bullet\">• Luister opnieuw. Misschien is het station met ander verkeer bezig.<\/p><p class=\"bullet\">• Doe na een redelijke pauze nogmaals een korte oproep. Herhaal niet eindeloos achter elkaar.<\/p><p class=\"bullet\">• Gebruik ter plaatse aanwezige alternatieven, zoals een meldknop, intercom of telefoonnummer, als die beschikbaar zijn.<\/p><p class=\"bullet\">• Blijf veilig manoeuvreren en volg lichten, seinen en borden. Een marifoonoproep is geen toestemming om door te varen.<\/p>", "questions": [], "group": "Praktijkoproepen"}, {"title": "7. Veelgemaakte fouten en betere formuleringen", "html": "<div class=\"tablewrap\"><table><tr><td>Minder goed<\/td><td>Beter<\/td><td>Waarom<\/td><\/tr><tr><td>“Sluis, wanneer kan ik erin?”<\/td><td>“Sluis [naam], hier motorjacht Orion. Ik nader vanaf de benedenkant en wil graag schutten. Over.”<\/td><td>Station, schip, positie en verzoek zijn duidelijk.<\/td><\/tr><tr><td>“Brug, ga je open?”<\/td><td>“Brug [naam], hier zeiljacht Neeltje. Wanneer is de volgende opening? Over.”<\/td><td>Kort, beleefd en ondubbelzinnig.<\/td><\/tr><tr><td>“Wij zijn er bijna.”<\/td><td>“Wij bevinden ons ongeveer 300 meter ten zuiden van de brug.”<\/td><td>Een concrete positie helpt.<\/td><\/tr><tr><td>“Oké.”<\/td><td>“Wachten aan stuurboord bij de remming. Begrepen. Uit.”<\/td><td>Belangrijke instructie wordt teruggelezen.<\/td><\/tr><tr><td>“Over en uit.”<\/td><td>Gebruik “over” als je antwoord verwacht en “uit” als het gesprek klaar is.<\/td><td>De woorden hebben een verschillende functie.<\/td><\/tr><\/table><\/div>", "questions": [], "group": "Praktijkoproepen"}, {"title": "8. Oefenkaarten", "html": "<h3>Oefening A: sluis<\/h3><p>Je nadert met motorjacht Orion de benedenkant van een sluis. Je wilt weten of je met de volgende schutting mee kunt.<\/p><p>Opdracht: Maak een oproep met de vier W’s.<\/p><p>Jouw tekst: ____________________________________________________________________<\/p><p>_______________________________________________________________________________<\/p><h3>Oefening B: brug<\/h3><p>Je zeiljacht is 12 meter lang en kan niet onder een gesloten brug door. Je nadert vanuit het westen.<\/p><p>Opdracht: Vraag wanneer de brug opent.<\/p><p>Jouw tekst: ____________________________________________________________________<\/p><p>_______________________________________________________________________________<\/p><h3>Oefening C: jachthaven<\/h3><p>Je zoekt voor één nacht een plaats. Je schip is 10,5 meter lang, 3,2 meter breed en steekt 1,7 meter.<\/p><p>Opdracht: Vraag om een passantenplaats en noteer de ligplaatsinstructie.<\/p><p>Jouw tekst: ____________________________________________________________________<\/p><p>_______________________________________________________________________________<\/p><h3>Oefening D: instructie teruglezen<\/h3><p>De sluismeester zegt dat je achter twee beroepsschepen moet aansluiten en aan bakboord moet wachten.<\/p><p>Opdracht: Lees de kern van de instructie terug en sluit af.<\/p><p>Jouw tekst: ____________________________________________________________________<\/p><p>_______________________________________________________________________________<\/p>", "questions": [], "group": "Praktijkoproepen"}, {"title": "9. Mini-geheugenkaart", "html": "<div class=\"tablewrap\"><table><tr><td>OPROEP [Station], hier [soort schip + naam]. Over.<\/td><\/tr><\/table><\/div><div class=\"tablewrap\"><table><tr><td>BERICHT Ik ben / vaar / nader [positie of richting]. Ik wil graag [verzoek]. Over.<\/td><\/tr><\/table><\/div><div class=\"tablewrap\"><table><tr><td>BEVESTIGING [Kerninstructie herhalen]. Begrepen. Over.<\/td><\/tr><\/table><\/div><div class=\"tablewrap\"><table><tr><td>AFSLUITING Dank u. Uit.<\/td><\/tr><\/table><\/div>", "questions": [], "group": "Praktijkoproepen"}, {"title": "10. Bronnen en actualiteitscontrole", "html": "<p>Dit document is oefenmateriaal. Actuele borden, nautische publicaties, lokale aanwijzingen, verkeerslichten en officiële cursus- en exameneisen zijn altijd leidend.<\/p><p class=\"bullet\">• Varen doe je Samen! / KNRM, De Marifoonkaart: https://www.knrm.nl/images/downloads/marifoonkaart.pdf<\/p><p class=\"bullet\">• CBR, Maritieme radiocommunicatie en examenonderdelen: https://www.cbr.nl/nl/maritieme-radiocommunicatie-1<\/p><p class=\"bullet\">• RDI, examen en bedieningscertificaten radioapparatuur op het water: https://www.rdi.nl/onderwerpen/vergunningen-en-registraties/marifoons-en-overige-maritieme-communicatieapparatuur/examen-en-bedieningscertificaten<\/p><p class=\"bullet\">• eGMDSS, Marcom-B VHF-spraakprocedure: https://www.egmdss.com/gmdss-courses/mod/page/view.php?id=690<\/p>", "questions": [], "group": "Praktijkoproepen"}];const generalQuestions=[{"q": "Waarom is antennehoogte belangrijk bij VHF?", "a": " Omdat VHF hoofdzakelijk binnen de zichtlijn werkt en een hogere antenne de radiohorizon vergroot."}, {"q": "Waarvoor wordt VHF-kanaal 70 gebruikt?", "a": " Voor DSC-signalen, niet voor gesproken verkeer."}, {"q": "Wat is het verschil tussen MAYDAY en PAN PAN?", "a": " MAYDAY is voor ernstig en onmiddellijk gevaar waarbij onmiddellijke hulp nodig is. PAN PAN is dringend, maar geen distress."}, {"q": "Welke vijf gegevens zijn in een noodbericht minimaal essentieel?", "a": " Identiteit, positie, aard van de nood, benodigde hulp en aantal personen, aangevuld waar mogelijk."}, {"q": "Wat doet squelch?", "a": " Squelch onderdrukt de hoorbare ruis wanneer geen bruikbaar signaal wordt ontvangen."}, {"q": "Waarom gebruik je niet standaard hoog vermogen?", "a": " Omdat laag vermogen vaak voldoende is en onnodig hoog vermogen meer storing en onnodig bereik veroorzaakt."}, {"q": "Wat is de functie van een MMSI?", "a": " Het is de digitale identiteit van een maritiem station binnen DSC/GMDSS."}, {"q": "Wat is het verschil tussen radar-SART en AIS-SART?", "a": " Radar-SART reageert op radar; AIS-SART zendt een AIS-nooddoel uit."}, {"q": "Wat doe je na een DSC-distress alert?", "a": " Ga volgens de installatie en procedure naar het spraakkanaal en zend het gesproken MAYDAY-bericht uit."}, {"q": "Waarom mogen OVER en OUT niet samen?", "a": " OVER vraagt om antwoord, OUT beëindigt het verkeer."}, {"q": "Welke prioriteit heeft veiligheidsverkeer ten opzichte van routine?", "a": " Veiligheidsverkeer heeft voorrang boven routineverkeer, maar niet boven nood- of spoedverkeer."}, {"q": "Wat controleer je bij een EPIRB?", "a": " Onder meer registratie, bevestiging, batterij, ontgrendeling en toegestane testprocedure."}];const app=document.getElementById('app');let current='Theorie';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function active(tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById(tab).classList.add('active')}
function list(group){current=group;active(group==='Theorie'?'tab-theory':'tab-practice');app.innerHTML='<div class="intro">'+(group==='Theorie'?'Lees de volledige theorie uit je studiewijzer. Open een hoofdstuk en oefen daarna de bijbehorende vragen.':'Oefen de voorbeeldgesprekken en werkvolgorde voor bruggen, sluizen en jachthavens.')+'</div><input type="search" id="search" placeholder="Zoek een hoofdstuk of onderwerp" aria-label="Zoek hoofdstukken"><div class="cards" id="cards"></div>';const search=document.getElementById('search');search.addEventListener('input',()=>drawCards(group,search.value));drawCards(group,'');window.scrollTo(0,0)}
function drawCards(group,term){const target=document.getElementById('cards');target.innerHTML='';chapters.forEach((s,i)=>{if(s.group!==group||!(s.title+' '+s.html.replace(/<[^>]*>/g,' ')).toLowerCase().includes(term.toLowerCase()))return;const b=document.createElement('button');b.className='card';b.innerHTML='<span class="pill">'+esc(group)+'</span><b>'+esc(s.title)+'</b><small>Lees de lesstof'+(s.questions.length?' en oefen '+s.questions.length+' vraag'+(s.questions.length===1?'':'en'):'')+'</small>';b.onclick=()=>openChapter(i);target.appendChild(b)});if(!target.children.length)target.innerHTML='<p>Geen hoofdstukken gevonden.</p>'}
function questionHTML(q){return '<div class="question"><p><strong>'+esc(q.q)+'</strong></p><button class="action" type="button" onclick="this.hidden=true;this.nextElementSibling.hidden=false">Toon antwoord</button><div class="answer" hidden>'+esc(q.a)+'</div></div>'}
function openChapter(i){const s=chapters[i];current=s.group;active(s.group==='Theorie'?'tab-theory':'tab-practice');app.innerHTML='<button class="back" onclick="list(current)">← Terug naar hoofdstukken</button><article class="reader"><span class="pill">'+esc(s.group)+'</span><h1>'+esc(s.title)+'</h1>'+s.html+'</article>'+(s.questions.length?'<section class="quizbox"><h2>Oefenvragen bij dit hoofdstuk</h2><p class="muted">Denk eerst zelf na; tik daarna op Toon antwoord.</p>'+s.questions.map(questionHTML).join('')+'</section>':'');window.scrollTo(0,0)}
function general(){active('tab-quiz');app.innerHTML='<div class="intro">Oefen de vragen uit het aangeleverde lesmateriaal. De antwoorden verschijnen pas wanneer je erop tikt.</div><section class="quizbox"><h1>Algemene oefenvragen</h1>'+generalQuestions.map(questionHTML).join('')+'</section>';window.scrollTo(0,0)}
list('Theorie');
</script></body></html>
