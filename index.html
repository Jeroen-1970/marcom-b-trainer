<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>MARCOM-B Trainer</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

button{
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    font-size: 16px;
}

#resultaat{
    margin-top:20px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>MARCOM-B Trainer</h1>

<h2 id="vraag">
Waarvoor wordt kanaal 70 gebruikt?
</h2>

<button onclick="controleer('A')">
A. Routineverkeer
</button>

<button onclick="controleer('B')">
B. Brugoproepen
</button>

<button onclick="controleer('C')">
C. DSC
</button>

<button onclick="controleer('D')">
D. Veiligheidsberichten
</button>

<div id="resultaat"></div>

<script>

function controleer(antwoord){

if(antwoord==="C"){

document.getElementById("resultaat").innerHTML =
"✅ Correct! Kanaal 70 wordt gebruikt voor DSC.";

}
else{

document.getElementById("resultaat").innerHTML =
"❌ Fout. Kanaal 70 wordt gebruikt voor DSC.";

}

}

</script>

</body>
</html>
