raak"],["Simplex","Zelfde frequentie voor zenden en ontvangen"],["Duplex","Verschillende zend- en ontvangstfrequenties"],["Werkkanaal","Kanaal voor verder gesprek"],["Brugkanaal","Lokaal aangegeven kanaal"],["Luister eerst","Controleer of kanaal vrij is"],["Kanaalwisseling","Ga naar afgesproken werkkanaal"]]},{"title":"Marifoon bedienen","track":"basis","intro":"Controleer voeding, antenne, volume en squelch. Spreek kort, druk PTT in en laat los om te luisteren.","concepts":[["PTT","Knop om te zenden"],["Squelch","Onderdrukt ruis zonder bruikbaar signaal"],["Volume","Regelt luidsprekersterkte"],["High Low","Regelt zendvermogen"],["Dual watch","Bewaking van twee kanalen afwisselend"],["Scan","Zoekt ingestelde kanalen af"],["Antenne","Zendt en ontvangt radiosignalen"],["Voeding","Levert elektrische energie"]]},{"title":"Radiodiscipline","track":"basis","intro":"Luister voor het zenden, noem het opgeroepen station en je scheepsnaam. Houd oproepen bondig.","concepts":[["OVER","Ik verwacht een antwoord"],["UIT","Verbinding beeindigd"],["ROGER","Bericht ontvangen"],["SAY AGAIN","Herhaal het bericht"],["CORRECTION","Ik verbeter een gegeven"],["Stand by","Wacht even"],["Scheepsnaam","Identificatie van eigen schip"],["Werkkanaal","Vervolg van routinegesprek"]]},{"title":"Spellingsalfabet","track":"basis","intro":"Spel kritieke woorden met het internationale alfabet en spreek getallen zorgvuldig uit.","concepts":[["Alfa","Letter A"],["Bravo","Letter B"],["Charlie","Letter C"],["Delta","Letter D"],["Echo","Letter E"],["Juliett","Letter J"],["Quebec","Letter Q"],["X-ray","Letter X"]]},{"title":"Cijfers en posities","track":"basis","intro":"Noem een actuele en ondubbelzinnige positie. Laat kritieke getallen bevestigen als de ontvangst slecht is.","concepts":[["Niner","Uitspraak van cijfer negen"],["Breedtegraad","Noord of zuid van evenaar"],["Lengtegraad","Oost of west van nulmeridiaan"],["Actuele positie","Locatie op dit moment"],["Cijfer voor cijfer","Verkleint kans op misvers ntent=clock(session.seconds);if(session.seconds<=0)finish()},1000);show()}function clock(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function chapterQuiz(i){start(Q.filter(q=>q.chapter===i),8,'Hoofdstuk '+(i+1))}function general(){stop();view('<section class="card"><h2>Algemene vragen</h2><p>Gemengde ronde: maximaal één variant per leerbegrip.</p><select id="count"><option>10</option><option selected>20</option><option>40</option><option>80</option><option value="176">Alle 176 begrippen</option></select> <button class="btn" onclick="start(Q,Number($('#count').value),'Algemene vragen')">Start</button></section>')}function exam(type){start(Q.filter(q=>q.track===type),type==='basis'?40:30,type==='basis'?'Examen MC':'Examen GMDSS',type==='basis'?3600:2700)}function mistakes(){stop();let pool=Q.filter(q=>db.wrong[q.id]),n=new Set(pool.map(q=>Math.floor(q.id/3))).size;view(`<section class="card"><h2>Mijn fouten</h2><p>${n} begrippen om te herhalen.</p>${n?`<button class="btn" onclick="start(Q.filter(q=>db.wrong[q.id]),${Math.min(20,n)},'Mijn fouten')">Oefen fouten</button>`:'Nog geen fouten opgeslagen.'}</section>`)}function show(){let s=session,q=s.items[s.i],a=s.answers[s.i],exam=s.label.startsWith('Examen');view(`<section class="card"><div class="row"><strong>${esc(s.label)}</strong><span>${s.i+1}/${s.items.length}</span>${s.seconds?`<strong id="clock">${clock(s.seconds)}</strong>`:''}</div><div class="bar"><span style="width:${s.i/s.items.length*100}%"></span></div><h2>${esc(q.q)}</h2><div class="answers">${q.o.map((o,i)=>`<button class="answer ${!exam&&a!==null?(i===q.a?'correct':i===a?'wrong':''):''}" ${!exam&&a!==null?'disabled':''} onclick="answer(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div>${!exam&&a!==null?`<div class="notice"><strong>${a===q.a?'Goed':'Niet goed'}</strong><br>${esc(q.e)}</div>`:''}<div class="row">${exam&&s.i>0?'<button class="btn" onclick="next(-1)">Vorige</button>':''}${exam||a!==null?`<button class="btn" onclick="next(1)">${s.i===s.items.length-1?'Afronden':'Volgende'}</button>`:''}${exam?'<button class="btn" onclick="finish()">Inleveren</button>':''}</div></section>`)}function answer(i){let s=session,exam=s.label.startsWith('Examen');if(!exam&&s.answers[s.i]!==null)return;s.answers[s.i]=i;if(!exam){let q=s.items[s.i],st=db.stats[q.chapter]??={right:0,total:0};st.total++;if(i===q.a){st.right++;delete db.wrong[q.id]}else db.wrong[q.id]=1;save()}show()}function next(d){if(d===1&&session.i===session.items.length-1){finish();return}session.i=Math.max(0,Math.min(session.items.length-1,session.i+d));show()}function finish(){if(!session||session.done)return;stop();let s=session;s.done=true;let good=0,errors=[];s.items.forEach((q,i)=>{let ok=s.answers[i]===q.a;if(ok)good++;else errors.push([q,s.answers[i]]);if(s.label.startsWith('Examen')){let st=db.stats[q.chapter]??={right:0,total:0};st.total++;if(ok){st.right++;delete db.wrong[q.id]}else db.wrong[q.id]=1}});save();let pass=s.label==='Examen MC'?28:s.label==='Examen GMDSS'?21:Math.ceil(.7*s.items.length);view(`<section class="card"><h2>Resultaat: ${esc(s.label)}</h2><h3>${good}/${s.items.length} goed (${Math.round(good/s.items.length*100)}%)</h3><p>Oefengrens ${pass}: ${good>=pass?'behaald':'niet behaald'}. Dit is geen officieel examen.</p><button class="btn" onclick="home()">Startscherm</button></section><section class="card"><h2>Foutenanalyse</h2>${errors.length?errors.map(([q,a])=>`<div class="concept"><strong>${esc(q.q)}</strong>Jouw antwoord: ${a===null?'Niet beantwoord':esc(q.o[a])}<br>Goed: ${esc(q.o[q.a])}<p>${esc(q.e)}</p></div>`).join(''):'Alles goed!'}</section>`)}function progress(){stop();view(`<section class="card"><h2>Voortgang</h2><p>${Object.keys(db.read).length}/22 hoofdstukken geopend.</p>${C.map((c,i)=>{let st=db.stats[i];return `<div class="concept"><strong>${i+1}. ${esc(c.title)}</strong>${st?`${st.right}/${st.total} goed (${Math.round(st.right/st.total*100)}%)`:'Nog niet geoefend'}</div>`}).join('')}</section>`)}home();</script></body></html>
